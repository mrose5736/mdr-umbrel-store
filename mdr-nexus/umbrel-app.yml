manifestVersion: 1
id: mdr-nexus
storage:
  dataRoot: data
category: developer
name: MDR-NEXUS
icon: https://raw.githubusercontent.com/mrose5736/mdr-umbrel-store/main/mdr-nexus/icon.png
version: "0.1.21"
tagline: Your accounts as one read-only personal API
description: >-
  MDR-NEXUS polls your own accounts (GitHub, mail, Spotify, Steam, Octopus Energy, Xbox and more) and serves the latest figures as one read-only API with scoped API keys, plus a dashboard with trends, per-connector pages and an activity log.


  Connectors only ever read. Upstream credentials are stored encrypted, and API keys are stored as hashes.


  Open the app, sign in with the password Umbrel shows for it, then add connectors under Connectors. To use Google, Spotify, Discord, Reddit, Twitch or Microsoft sign-in, put their client IDs and secrets in the nexus.env file in the app's data folder (see the store README).
releaseNotes: |-
  Use the new logo in the portal, README and favicon
